# Render deployment configuration for the AI Plant Disease Detector backend.
#
# Repo root is expected to be the folder containing this backend/ directory
# (the folder that also contains frontend/ and the .pth model).
# Render uploads only the rootDirectory subtree, so the model file must
# live inside backend/model_assets/ (see model_assets/README.md).
services:
  - type: web
    name: ai-plant-disease-detector-backend
    rootDirectory: backend
    plan: starter
    buildCommand: >
      pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # IMPORTANT: set this on the Render service (Environment tab) to the
      # exact origin of the deployed frontend, e.g.
      #   https://crop-doctor.vercel.app
      # Only that origin may call this API from a browser. Leaving it empty
      # restricts access to local development servers (localhost/127.0.0.1).
      # Do NOT paste a wildcard ("*") here.
      - key: FRONTEND_ORIGIN
        value: ""
      - key: MODEL_PATH
        value: model_assets/unified_plant_resnet50.onnx
      - key: DEVICE
        value: cpu
      - key: ORT_INTRA_OP_THREADS
        value: "2"
