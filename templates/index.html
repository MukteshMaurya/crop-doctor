<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Doctor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
        .btn-container { margin: 20px 0; display: flex; gap: 10px; justify-content: center; }
        button, label.btn { padding: 12px 20px; background-color: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; text-decoration: none; display: inline-block; }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; height: auto; margin-top: 15px; border-radius: 8px; display: none; }
        #result { margin-top: 20px; text-align: left; background: #f5f5f5; padding: 15px; border-radius: 8px; display: none; }
        .loading { color: #f39c12; font-weight: bold; margin-top: 15px; display: none; }
        .error { color: #d32f2f; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🌱 Crop Doctor</h1>
    <p>Upload or capture a crop leaf image for instant diagnosis.</p>

    <div class="btn-container">
        <!-- Gallery Upload -->
        <label for="gallery-input" class="btn">📁 Choose from Gallery</label>
        <input type="file" id="gallery-input" accept="image/*" onchange="handleImageSelect(event)">

        <!-- Camera Capture -->
        <label for="camera-input" class="btn">📷 Take Photo</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleImageSelect(event)">
    </div>

    <img id="preview" alt="Selected Leaf Image">
    <div id="loading" class="loading">Analyzing plant image...</div>
    <div id="result"></div>

    <script>
        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Display preview
            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';

            // Reset status views
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            resultDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Use relative route '/predict' so it automatically targets your live Render host
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                loadingDiv.style.display = 'none';

                if (data.success) {
                    const rx = data.prescription;
                    resultDiv.innerHTML = `
                        <h2>Diagnosis Result</h2>
                        <p><strong>Disease:</strong> ${rx.disease_name}</p>
                        <p><strong>Confidence:</strong> ${data.confidence}</p>
                        <p><strong>Status:</strong> ${rx.status}</p>
                        <hr>
                        <p><strong>Description:</strong> ${rx.description}</p>
                        <p><strong>Organic Remedy:</strong> ${rx.organic_remedy}</p>
                        <p><strong>Chemical Treatment:</strong> ${rx.chemical_treatment}</p>
                        <p><strong>Prevention:</strong> ${rx.prevention}</p>
                    `;
                    resultDiv.style.display = 'block';
                } else {
                    resultDiv.innerHTML = `<p class="error">Error: ${data.error || 'Prediction failed'}</p>`;
                    resultDiv.style.display = 'block';
                }
            } catch (err) {
                loadingDiv.style.display = 'none';
                resultDiv.innerHTML = `<p class="error">Failed to connect to API: ${err.message}</p>`;
                resultDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
